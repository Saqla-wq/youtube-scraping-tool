<!DOCTYPE html>
<html>

<head>

    <title>YouTube Scraper</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>YouTube Channel Scraper</h1>

        <div class="card">

            <form method="POST">

                <label>Country</label>

                <select name="country">
                    {% for country in countries %}
                    <option value="{{country}}">{{country}}</option>
                    {% endfor %}
                </select>

                <label>Categories (comma separated)</label>
                <input type="text" name="categories" placeholder="Example: gaming, technology, education">

                <label>Number of Channels (per category)</label>
                <input type="number" name="count" value="5">

                <button type="submit">Search Channels</button>

            </form>

        </div>

        {% if channels_by_category %}

        <div class="card">

            <h2>Select Channels</h2>

            <form method="POST" action="/scrape">

                <div class="channel-list">

                    {% for category, channels in channels_by_category.items() %}

                    <h3>📺 {{ category|capitalize }} Channels</h3>

                    {% for ch in channels %}

                    <div class="channel-item">

                        <input type="checkbox" name="channels" value="{{ch}}">

                        <a class="channel-link" href="{{ch}}" target="_blank">{{ch}}</a>

                    </div>

                    {% endfor %}

                    {% endfor %}

                </div>

                <button type="submit">Scrape Selected Channels</button>

            </form>

        </div>

        {% endif %}

    </div>

</body>

</html>
