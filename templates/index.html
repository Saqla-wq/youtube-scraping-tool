<!DOCTYPE html>
<html>

<head>
    <title>YouTube Scraper</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <h2>YouTube Channel Scraper</h2>

    <form method="POST">

        <label>Select Country</label>

        <select name="country">
            {% for c in countries %}
            <option value="{{c}}">{{c}}</option>
            {% endfor %}
        </select>

        <label>Select Category</label>

        <select name="category">
            {% for c in categories %}
            <option value="{{c}}">{{c}}</option>
            {% endfor %}
        </select>

        <button type="submit">Search Channels</button>

    </form>

    <hr>

    <h3>Paste Channel Video URLs</h3>

    <form action="/scrape" method="POST">

        <textarea name="channels" rows="10" cols="70" placeholder="Paste channel /videos links here..."></textarea>

        <br><br>

        <button type="submit">Scrape Channels</button>

    </form>

</body>

</html>
